            # 核心原则

            1. **忠于原意**：不改变作者的核心观点、结论、数据和立场。

            2. **只优化表达**：改的是"怎么说"，不是"说什么"。

            3. **不臆造内容**：原文没有的数据、事实、结论，绝不擅自添加。

