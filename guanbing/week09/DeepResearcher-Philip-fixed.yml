    - data:
        code: "import json\n\ndef main(llm_keywords: str):\n    if not isinstance(llm_keywords, str) or not llm_keywords.strip():\n        raise ValueError(\"LLM-breakdown: 输出为空或不是字符串，请检查模型响应后重试。\")\n\n    text = llm_keywords.strip().lstrip(\"\\ufeff\").strip()\n    try:\n        data = json.loads(text)\n    except json.JSONDecodeError:\n        # Decode complete objects inside Markdown fences or surrounding prose.\n        # raw_decode respects nested structures and braces inside JSON strings.\n        decoder = json.JSONDecoder()\n        data = None\n        pos = 0\n        while pos < len(text):\n            start = text.find(\"{\", pos)\n            if start < 0:\n                break\n            try:\n                candidate, end = decoder.raw_decode(text, start)\n            except json.JSONDecodeError:\n                pos = start + 1\n                continue\n            if isinstance(candidate, dict) and \"keywords\" in candidate:\n                data = candidate\n                break\n            pos = end\n        if data is None:\n            raise ValueError(\"LLM-breakdown: 未找到含 keywords 的有效 JSON 对象，请检查模型输出后重试。\") from None\n\n    if not isinstance(data, dict):\n        raise ValueError(\"LLM-breakdown: JSON 顶层必须是包含 keywords 的对象。\")\n    keywords = data.get(\"keywords\")\n    if not isinstance(keywords, list) or not keywords:\n        raise ValueError(\"LLM-breakdown: keywords 必须是非空字符串数组。\")\n    if any(not isinstance(item, str) or not item.strip() for item in keywords):\n        raise ValueError(\"LLM-breakdown: keywords 中每一项都必须是非空字符串。\")\n    return {\"keywords\": [item.strip() for item in keywords]}\n"
        code_language: python3
