<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emotion Chat</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f6f8;
        --panel: #ffffff;
        --text: #1c2430;
        --muted: #6b7684;
        --border: #e3e7ee;
        --accent: #2f6fed;
        --danger: #c8372d;
        --danger-bg: #fdecea;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      .app {
        width: min(760px, 100%);
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border-inline: 1px solid var(--border);
      }

      header {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 18px 22px;
        border-bottom: 1px solid var(--border);
      }

      header h1 { margin: 0; font-size: 18px; }
      header .hint { margin: 0; color: var(--muted); font-size: 12px; }

      .status {
        margin-left: auto;
        font-size: 12px;
        color: var(--muted);
      }

      .banner {
        margin: 12px 22px 0;
        padding: 10px 14px;
        border-radius: 10px;
        background: var(--danger-bg);
        color: var(--danger);
        font-size: 13px;
      }

      .banner.hidden { display: none; }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 18px 22px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .row { display: flex; }
      .row.user { justify-content: flex-end; }

      .bubble {
        max-width: 78%;
        padding: 10px 14px;
        border-radius: 14px;
        line-height: 1.6;
        font-size: 14px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
      .assistant .bubble { background: #eef1f6; border-bottom-left-radius: 4px; }
      .assistant .bubble.streaming::after {
        content: "▍";
        margin-left: 2px;
        animation: blink 1s steps(2, start) infinite;
      }
      .assistant .bubble.error { background: var(--danger-bg); color: var(--danger); }

      @keyframes blink { to { visibility: hidden; } }

      .composer {
        display: flex;
        gap: 10px;
        padding: 14px 22px 18px;
        border-top: 1px solid var(--border);
      }

      textarea {
        flex: 1;
        resize: none;
        max-height: 140px;
        padding: 11px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        font: inherit;
        font-size: 14px;
        outline: none;
      }

      textarea:focus { border-color: var(--accent); }

      button {
        padding: 0 20px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }

      button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Emotion Chat</h1>
        <p class="hint">LangGraph + Kafka 情感识别对话 demo</p>
        <span id="status" class="status">就绪</span>
      </header>

      <div id="banner" class="banner hidden"></div>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="send" type="submit">发送</button>
      </form>
    </main>

    <script src="app.js"></script>
  </body>
</html>
