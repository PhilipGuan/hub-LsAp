<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>暖语 · 情感支持对话</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ee;
      --panel: #ffffff;
      --ink: #2f2a26;
      --muted: #8b8178;
      --line: #eadfd4;
      --brand: #e07a5f;
      --brand-soft: #fbe9e3;
      --user: #2f2a26;
      --shadow: 0 18px 45px rgba(64, 45, 30, 0.12);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 15% -10%, #fff7ef 0%, transparent 60%),
        radial-gradient(900px 500px at 110% 10%, #f1e7ff 0%, transparent 55%),
        var(--bg);
      display: flex;
      justify-content: center;
      padding: 28px 16px;
    }

    .app {
      width: min(880px, 100%);
      height: calc(100vh - 56px);
      min-height: 560px;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fffdfa, #fffaf5);
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .logo {
      width: 42px; height: 42px;
      display: grid; place-items: center;
      border-radius: 14px;
      background: var(--brand-soft);
      color: var(--brand);
      font-weight: 700;
      font-size: 20px;
    }

    header h1 { margin: 0; font-size: 17px; letter-spacing: 0.02em; }
    header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

    button {
      font: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    #new-chat {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      transition: all 0.18s ease;
    }
    #new-chat:hover { color: var(--brand); border-color: var(--brand); }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 26px 24px 12px;
      scroll-behavior: smooth;
    }

    .welcome {
      max-width: 520px;
      margin: 8vh auto 0;
      text-align: center;
    }
    .welcome h2 { margin: 0 0 10px; font-size: 26px; font-weight: 650; }
    .welcome p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 26px;
    }
    .chip {
      padding: 9px 14px;
      border-radius: 999px;
      background: #fbf7f2;
      border: 1px solid var(--line);
      color: #6c625a;
      font-size: 13px;
      transition: all 0.18s ease;
    }
    .chip:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }

    .row {
      display: flex;
      margin-bottom: 16px;
      animation: rise 0.22s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .row.user { justify-content: flex-end; }

    .bubble {
      max-width: min(76%, 620px);
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .bubble {
      background: var(--user);
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    .assistant .bubble {
      background: #fbf7f2;
      border: 1px solid var(--line);
      border-bottom-left-radius: 6px;
    }

    .assistant .bubble.streaming::after {
      content: "";
      display: inline-block;
      width: 7px; height: 1.05em;
      margin-left: 3px;
      vertical-align: -0.16em;
      background: var(--brand);
      animation: blink 1s steps(2, start) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .assistant .bubble.error { color: #b04a3c; background: #fff3f0; border-color: #f4cfc7; }

    footer {
      padding: 14px 24px 20px;
      border-top: 1px solid var(--line);
      background: linear-gradient(0deg, #fffdfa, #ffffff);
    }

    #composer {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      padding: 10px 12px 10px 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    #composer:focus-within {
      border-color: #e8b7a6;
      box-shadow: 0 0 0 4px rgba(224, 122, 95, 0.08);
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      font: inherit;
      font-size: 15px;
      line-height: 1.6;
      max-height: 140px;
      padding: 6px 0;
      color: var(--ink);
    }
    textarea::placeholder { color: #b3a89f; }

    #send {
      flex: none;
      width: 42px; height: 42px;
      border-radius: 14px;
      background: var(--brand);
      color: #fff;
      font-size: 14px;
      display: grid;
      place-items: center;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    #send:hover:not(:disabled) { transform: translateY(-1px); }
    #send:disabled { opacity: 0.45; cursor: not-allowed; }

    .status {
      min-height: 18px;
      margin: 8px 2px 0;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 620px) {
      body { padding: 0; }
      .app { height: 100vh; border-radius: 0; border: none; }
      main { padding: 20px 16px 8px; }
      footer { padding: 12px 16px 16px; }
      .bubble { max-width: 86%; }
      .welcome { margin-top: 4vh; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">暖</div>
        <div>
          <h1>暖语</h1>
          <p>先听懂你，再陪你说话</p>
        </div>
      </div>
      <button id="new-chat" type="button">新对话</button>
    </header>

    <main id="messages" aria-live="polite"></main>

    <footer>
      <form id="composer">
        <textarea id="input" rows="1" placeholder="说说你现在的心情…（Enter 发送，Shift + Enter 换行）"></textarea>
        <button id="send" type="submit" aria-label="发送">发送</button>
      </form>
      <p id="status" class="status" role="status"></p>
    </footer>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");
    const formEl = document.getElementById("composer");
    const newChatBtn = document.getElementById("new-chat");

    const welcomeHTML = `
      <section class="welcome">
        <h2>今天感觉怎么样？</h2>
        <p>你可以从任何一件小事说起，我会认真听。</p>
        <div class="chips">
          <button class="chip" type="button">今天工作压力好大</button>
          <button class="chip" type="button">最近总是睡不好</button>
          <button class="chip" type="button">有件小事让我挺开心的</button>
        </div>
      </section>`;

    const newId = () => (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);

    const state = {
      sessionId: sessionStorage.getItem("support.session_id") || newId(),
      userId: sessionStorage.getItem("support.user_id") || `web-${Math.random().toString(36).slice(2, 8)}`,
      round: Number(sessionStorage.getItem("support.round") || 0),
      previous: sessionStorage.getItem("support.previous") || null,
      streaming: false,
      source: null,
      bubble: null,
      buffer: "",
    };
    persistState();

    function persistState() {
      sessionStorage.setItem("support.session_id", state.sessionId);
      sessionStorage.setItem("support.user_id", state.userId);
      sessionStorage.setItem("support.round", String(state.round));
      if (state.previous) sessionStorage.setItem("support.previous", state.previous);
      else sessionStorage.removeItem("support.previous");
    }

    function resetView() {
      messagesEl.innerHTML = welcomeHTML;
      messagesEl.querySelectorAll(".chip").forEach((chip) => {
        chip.addEventListener("click", () => send(chip.textContent));
      });
      statusEl.textContent = "";
    }

    function addRow(role) {
      messagesEl.querySelector(".welcome")?.remove();
      const row = document.createElement("div");
      row.className = `row ${role}`;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      return bubble;
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setStreaming(on) {
      state.streaming = on;
      inputEl.disabled = on;
      sendBtn.disabled = on;
      if (!on) {
        inputEl.focus();
        state.bubble = null;
      }
    }

    function finishBubble() {
      state.bubble?.classList.remove("streaming");
    }

    function showError(message) {
      finishBubble();
      if (state.bubble && !state.buffer) {
        state.bubble.classList.add("error");
      }
      const text = state.buffer ? `${state.buffer}\n\n（${message}）` : message;
      if (state.bubble) state.bubble.textContent = text;
      statusEl.textContent = "";
    }

    async function send(text) {
      const message = (text ?? inputEl.value ?? "").trim();
      if (!message || state.streaming) return;

      inputEl.value = "";
      inputEl.style.height = "auto";
      setStreaming(true);
      statusEl.textContent = "正在判断情绪…";

      const userBubble = addRow("user");
      userBubble.textContent = message;
      scrollToBottom();

      const assistantBubble = addRow("assistant");
      assistantBubble.textContent = "";
      assistantBubble.classList.add("streaming");
      state.bubble = assistantBubble;
      state.buffer = "";
      scrollToBottom();

      try {
        const response = await fetch("/chat/trigger", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            session_id: state.sessionId,
            user_id: state.userId,
            message,
            clarification_round: state.round,
            previous_clarification: state.previous,
          }),
        });
        if (!response.ok) throw new Error("服务暂时不可用，请稍后再试");
        const data = await response.json();
        listen(data.request_id);
      } catch (error) {
        showError(error.message || "请求失败");
        setStreaming(false);
      }
    }

    function listen(requestId) {
      const source = new EventSource(`/chat/stream/${encodeURIComponent(requestId)}`);
      state.source = source;
      let settled = false;

      const finish = () => {
        if (settled) return;
        settled = true;
        source.close();
        if (state.source === source) state.source = null;
        finishBubble();
        setStreaming(false);
      };

      source.onmessage = (event) => {
        let data;
        try {
          data = JSON.parse(event.data);
        } catch {
          return;
        }

        if (typeof data.t === "string") {
          state.buffer += data.t;
          if (state.bubble) state.bubble.textContent = state.buffer;
          statusEl.textContent = "正在回复…";
          scrollToBottom();
          return;
        }

        if (data.done) {
          if (typeof data.full === "string" && data.full) state.buffer = data.full;
          if (state.bubble) state.bubble.textContent = state.buffer;
          state.round = 0;
          state.previous = null;
          persistState();
          statusEl.textContent = "";
          finish();
          return;
        }

        if (data.type === "clarification") {
          state.buffer = data.reply || "";
          if (state.bubble) state.bubble.textContent = state.buffer;
          state.round += 1;
          state.previous = state.buffer;
          persistState();
          statusEl.textContent = "再补充一点，我会更懂你";
          finish();
          return;
        }

        if (data.error) {
          showError(data.error === "timeout" ? "等待超时，请重试" : "生成失败，请稍后重试");
          finish();
        }
      };

      source.onerror = () => {
        if (settled) return;
        showError("连接中断，请重试");
        finish();
      };
    }

    function autoResize() {
      inputEl.style.height = "auto";
      inputEl.style.height = `${Math.min(inputEl.scrollHeight, 140)}px`;
    }

    inputEl.addEventListener("input", autoResize);
    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        send(inputEl.value);
      }
    });

    formEl.addEventListener("submit", (event) => {
      event.preventDefault();
      send(inputEl.value);
    });

    newChatBtn.addEventListener("click", () => {
      state.source?.close();
      state.source = null;
      state.sessionId = newId();
      state.round = 0;
      state.previous = null;
      state.buffer = "";
      persistState();
      resetView();
      setStreaming(false);
      inputEl.focus();
    });

    resetView();
    inputEl.focus();
  </script>
</body>
</html>
