<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>情绪支持助手</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #eef4ff, #fdf1f7);
      color: #1f2937;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }
    main {
      width: min(680px, 100%);
      padding: 28px;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(60, 72, 100, 0.15);
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .subtitle { margin: 0 0 22px; color: #667085; }
    textarea {
      width: 100%;
      min-height: 150px;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      resize: vertical;
      font: inherit;
      outline: none;
    }
    textarea:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      border: 0;
      border-radius: 12px;
      background: #4f46e5;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    button:disabled { opacity: 0.6; cursor: wait; }
    #error {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #fef3f2;
      color: #b42318;
    }
    #result {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eaecf0;
    }
    .row { margin-bottom: 14px; }
    .label { color: #667085; font-size: 13px; margin-bottom: 5px; }
    .value { line-height: 1.7; white-space: pre-wrap; }
    .sentiment {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: #eef2ff;
      color: #4338ca;
      font-weight: 700;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>情绪支持助手</h1>
    <p class="subtitle">输入今天发生的事情，系统会识别情绪并给出对应回复。</p>

    <form id="chatForm">
      <textarea
        id="message"
        maxlength="2000"
        placeholder="例如：今天面试通过了，但是我还有点不敢相信……"
        required
      ></textarea>
      <button id="submitButton" type="submit">开始分析</button>
    </form>

    <div id="error" hidden></div>

    <section id="result" hidden>
      <div class="row">
        <div class="label">情感识别</div>
        <div class="sentiment" id="sentiment"></div>
      </div>
      <div class="row">
        <div class="label">判断理由</div>
        <div class="value" id="reason"></div>
      </div>
      <div class="row">
        <div class="label">回复</div>
        <div class="value" id="reply"></div>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("chatForm");
    const messageInput = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");
    const errorBox = document.getElementById("error");
    const resultBox = document.getElementById("result");
    const sentimentBox = document.getElementById("sentiment");
    const reasonBox = document.getElementById("reason");
    const replyBox = document.getElementById("reply");

    const sentimentLabels = {
      positive: "正向 😊",
      negative: "负面 😔",
      neutral: "中性 😐"
    };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = messageInput.value.trim();
      if (!message) return;

      errorBox.hidden = true;
      resultBox.hidden = true;
      submitButton.disabled = true;
      submitButton.textContent = "分析中...";

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.detail || `请求失败：${response.status}`);
        }

        sentimentBox.textContent = sentimentLabels[data.sentiment] || data.sentiment;
        reasonBox.textContent = data.reason;
        replyBox.textContent = data.reply;
        resultBox.hidden = false;
      } catch (error) {
        errorBox.textContent = error.message || "请求失败，请稍后重试";
        errorBox.hidden = false;
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "开始分析";
      }
    });
  </script>
</body>
</html>
