[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chinook-sql-agent-web"
version = "0.1.0"
description = "Chinook SQL Agent 的网页对话前端（复用 task1 的 LangGraph workflow）"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

# task1 的 sql_agent 包通过 sys.path 引入（见 server.py 顶部），无需在此声明依赖。
