# 一条命令启动整套 Demo：Kafka + FastAPI（同时托管前端）+ 两个 Agents SDK worker
# 使用：docker compose up --build
# 浏览器打开 http://localhost:8000
services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      # 单节点 KRaft（无 ZooKeeper）；容器内部用服务名 kafka:9092
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  api:
    build: .
    image: sentiment-chat-agents:latest
    env_file: .env
    environment:
      # 覆盖 .env 里的 localhost，指向 compose 网络中的 kafka 服务
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8000:8000"
    depends_on:
      kafka:
        condition: service_healthy

  sentiment-worker:
    image: sentiment-chat-agents:latest
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: python -m backend.agents_sdk_impl.sentiment_worker
    depends_on:
      kafka:
        condition: service_healthy

  reply-worker:
    image: sentiment-chat-agents:latest
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: python -m backend.agents_sdk_impl.reply_worker
    depends_on:
      kafka:
        condition: service_healthy
