<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chinook 数据问答</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         font: 15px/1.6 system-ui, -apple-system, "Microsoft YaHei", sans-serif;
         background: #f7f7f8; color: #1f2328; }
  header { display: flex; align-items: center; justify-content: space-between;
           padding: 14px 20px; background: #fff; border-bottom: 1px solid #e6e6e9; }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 12px; color: #6b7280; }
  #new { border: 1px solid #d8d8dd; background: #fff; border-radius: 8px;
         padding: 6px 12px; font-size: 13px; cursor: pointer; }
  #new:hover { background: #f3f3f5; }
  main { flex: 1; overflow-y: auto; padding: 20px; }
  .wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 10px; }
  .row.me { justify-content: flex-end; }
  .bubble { max-width: 86%; padding: 10px 14px; border-radius: 12px; word-break: break-word; }
  .me .bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .bot .bubble { background: #fff; border: 1px solid #e6e6e9; border-bottom-left-radius: 4px; }
  .bubble p { margin: 6px 0; }
  .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 14px; }
  .bubble th, .bubble td { border: 1px solid #e0e0e4; padding: 4px 10px; text-align: left; }
  .bubble th { background: #fafafa; font-weight: 600; }
  .bubble code { background: #f2f2f4; padding: 1px 4px; border-radius: 4px; font-size: 13px; }
  .meta { margin-top: 8px; font-size: 12px; color: #6b7280; display: flex; flex-wrap: wrap;
          gap: 6px; align-items: center; }
  .tag { background: #eef2ff; color: #3730a3; border-radius: 999px; padding: 1px 8px; }
  .tag.warn { background: #fef3c7; color: #92400e; }
  details { margin-top: 8px; font-size: 13px; }
  summary { cursor: pointer; color: #2563eb; }
  details pre { background: #fafafa; border: 1px solid #ececf0; border-radius: 8px;
                padding: 10px; overflow-x: auto; white-space: pre-wrap; font-size: 12.5px;
                font-family: ui-monospace, Consolas, monospace; }
  details ul { margin: 6px 0; padding-left: 18px; }
  .dots span { display: inline-block; width: 5px; height: 5px; margin-right: 4px; border-radius: 50%;
                background: #9ca3af; animation: b 1s infinite alternate; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes b { from { opacity: .25 } to { opacity: 1 } }
  footer { padding: 12px 20px 18px; background: #f7f7f8; }
  form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
         background: #fff; border: 1px solid #d8d8dd; border-radius: 12px; padding: 8px; }
  form:focus-within { border-color: #2563eb; }
  textarea { flex: 1; border: none; outline: none; resize: none; font: inherit;
             max-height: 120px; padding: 6px; background: transparent; }
  #send { border: none; background: #2563eb; color: #fff; border-radius: 8px;
          padding: 8px 16px; font-size: 14px; cursor: pointer; }
  #send:disabled { background: #b9c3f5; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Chinook 数据问答</h1>
    <p>用自然语言查音乐商店数据库，支持多轮追问</p>
  </div>
  <button id="new">新对话</button>
</header>

<main><div class="wrap" id="list"></div></main>

<footer>
  <form id="form">
    <textarea id="q" rows="1" placeholder="例如：销售额最高的 3 位艺术家是谁"></textarea>
    <button id="send" type="submit">发送</button>
  </form>
</footer>

<script>
const list = document.getElementById('list');
const form = document.getElementById('form');
const q = document.getElementById('q');
const send = document.getElementById('send');
let thread = crypto.randomUUID();

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function bubble(role, html) {
  const row = document.createElement('div');
  row.className = 'row ' + (role === 'me' ? 'me' : 'bot');
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = html;
  row.appendChild(b);
  list.appendChild(row);
  list.parentElement.scrollTop = list.parentElement.scrollHeight;
  return b;
}

function render(answer) {
  return window.marked ? marked.parse(esc(answer))
                       : '<p>' + esc(answer).replace(/\n/g, '<br>') + '</p>';
}

function detail(b, data) {
  const parts = [];
  if (data.sql) parts.push('<details open><summary>SQL</summary><pre>' + esc(data.sql) + '</pre></details>');
  if (data.tables && data.tables.length)
    parts.push('<div class="meta">' + data.tables.map(t => '<span class="tag">' + esc(t) + '</span>').join('') +
               '<span>' + data.row_count + ' 行' + (data.truncated ? '（已截断）' : '') + '</span></div>');
  if (data.evidence && data.evidence.length)
    parts.push('<details><summary>依据（' + data.evidence.length + '）</summary><ul>' +
               data.evidence.map(e => '<li>' + esc(e) + '</li>').join('') + '</ul></details>');
  if (data.caveats && data.caveats.length)
    parts.push('<div class="meta">' + data.caveats.map(c => '<span class="tag warn">' + esc(c) + '</span>').join('') + '</div>');
  b.insertAdjacentHTML('beforeend', parts.join(''));
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text) return;

  bubble('me', '<p>' + esc(text) + '</p>');
  q.value = '';
  q.style.height = 'auto';
  send.disabled = true;
  const b = bubble('bot', '<span class="dots"><span></span><span></span><span></span></span>');

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text, thread_id: thread })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    b.innerHTML = render(data.answer);
    detail(b, data);
  } catch (err) {
    b.innerHTML = '<p>请求失败：' + esc(err.message) + '</p>';
  } finally {
    send.disabled = false;
    q.focus();
    list.parentElement.scrollTop = list.parentElement.scrollHeight;
  }
});

q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
q.addEventListener('input', () => {
  q.style.height = 'auto';
  q.style.height = Math.min(q.scrollHeight, 120) + 'px';
});

document.getElementById('new').onclick = () => {
  thread = crypto.randomUUID();
  list.innerHTML = '';
  bubble('bot', '<p>已开始新对话。想查点什么？比如「2009 年每个月的销售额是多少」。</p>');
  q.focus();
};
</script>
</body>
</html>
