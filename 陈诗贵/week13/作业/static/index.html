<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL Agent · 对话式数据查询</title>
<style>
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --line: #e3e8f0;
    --text: #1f2937;
    --muted: #6b7280;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --user-bubble: #2563eb;
    --ai-bubble: #ffffff;
    --code-bg: #f1f5f9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }

  /* ---------- 顶部 ---------- */
  header {
    flex: 0 0 auto;
    padding: 14px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: .2px;
  }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    font-size: 12px;
    padding: 2px 9px;
    border-radius: 999px;
    background: #eef2ff;
    color: #3730a3;
    border: 1px solid #e0e7ff;
  }
  .badge.warn { background: #fef2f2; color: #991b1b; border-color: #fecaca; }

  /* ---------- 对话区 ---------- */
  main {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 22px 20px 8px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }

  .row { display: flex; margin-bottom: 18px; }
  .row.user { justify-content: flex-end; }
  .row.ai { justify-content: flex-start; }

  .bubble {
    max-width: min(86%, 680px);
    padding: 12px 15px;
    border-radius: 14px;
    box-shadow: 0 1px 3px rgba(16, 24, 40, .06);
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .row.ai .bubble {
    background: var(--ai-bubble);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }

  .meta {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  details {
    margin-top: 10px;
    border-top: 1px dashed var(--line);
    padding-top: 8px;
  }
  summary {
    cursor: pointer;
    font-size: 12.5px;
    color: var(--primary);
    user-select: none;
    outline: none;
  }
  summary::-webkit-details-marker { color: var(--primary); }
  pre {
    margin: 8px 0 0;
    padding: 10px 12px;
    background: var(--code-bg);
    border-radius: 8px;
    font-size: 12.5px;
    line-height: 1.5;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  .trace-line { font-size: 12.5px; color: #374151; padding: 1px 0; }

  /* ---------- 加载动画 ---------- */
  .dots span {
    display: inline-block;
    width: 6px; height: 6px;
    margin-right: 4px;
    border-radius: 50%;
    background: var(--primary);
    animation: blink 1.4s infinite both;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* ---------- 底部输入 ---------- */
  footer {
    flex: 0 0 auto;
    background: var(--card);
    border-top: 1px solid var(--line);
    padding: 12px 20px 16px;
  }
  .examples {
    max-width: 860px;
    margin: 0 auto 10px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .chip {
    font-size: 12.5px;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fafbfe;
    color: var(--muted);
    cursor: pointer;
    transition: .15s;
  }
  .chip:hover { border-color: var(--primary); color: var(--primary); background: #eff6ff; }

  form {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    resize: none;
    min-height: 46px;
    max-height: 140px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    font: inherit;
    color: inherit;
    background: #fff;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
  }
  button#send {
    flex: 0 0 auto;
    height: 46px;
    padding: 0 22px;
    border: none;
    border-radius: 12px;
    background: var(--primary);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  button#send:hover:not(:disabled) { background: var(--primary-dark); }
  button#send:disabled { opacity: .55; cursor: not-allowed; }

  .hint {
    max-width: 860px;
    margin: 8px auto 0;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <h1>SQL Agent · 对话式数据查询</h1>
  <div class="badges" id="badges"></div>
</header>

<main>
  <div class="wrap" id="chat"></div>
</main>

<footer>
  <div class="examples" id="examples"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="输入你的问题，例如：一共有多少首歌？（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send" type="submit">发送</button>
  </form>
  <div class="hint">由 LangGraph 七阶段流程驱动：解析 → 选表 → 生成 SQL → 校验 → 执行 → 汇总</div>
</footer>

<script>
const chatEl = document.getElementById('chat');
const formEl = document.getElementById('form');
const inputEl = document.getElementById('input');
const sendEl = document.getElementById('send');
const badgesEl = document.getElementById('badges');
const examplesEl = document.getElementById('examples');

const EXAMPLES = [
  '一共有多少首歌？',
  '销售额最高的前 5 个国家是哪些？',
  '每个流派的歌曲数量分别是多少？',
  '哪位员工的工龄最长？'
];

/* ---------- 初始化 ---------- */
async function init() {
  // 示例问题按钮
  EXAMPLES.forEach(q => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = q;
    b.onclick = () => { inputEl.value = q; inputEl.focus(); };
    examplesEl.appendChild(b);
  });

  // 读取后端配置
  try {
    const r = await fetch('/api/config');
    const cfg = await r.json();
    addBadge(`模型 ${cfg.model}`);
    addBadge(`数据库 ${cfg.db}`);
    if (!cfg.has_key) addBadge('未配置 API Key', true);
  } catch (e) {
    addBadge('后端未连接', true);
  }
}

function addBadge(text, warn) {
  const s = document.createElement('span');
  s.className = 'badge' + (warn ? ' warn' : '');
  s.textContent = text;
  badgesEl.appendChild(s);
}

/* ---------- 渲染气泡 ---------- */
function appendUser(text) {
  const row = document.createElement('div');
  row.className = 'row user';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;                 // 用 textContent 防 XSS
  row.appendChild(b);
  chatEl.appendChild(row);
  scrollBottom();
}

function appendAI(data) {
  const row = document.createElement('div');
  row.className = 'row ai';
  const b = document.createElement('div');
  b.className = 'bubble';

  // 主回答
  const ans = document.createElement('div');
  ans.textContent = data.answer || '（无回答）';
  b.appendChild(ans);

  // SQL 折叠块
  if (data.sql) {
    const d = document.createElement('details');
    const s = document.createElement('summary');
    s.textContent = '查看执行的 SQL';
    d.appendChild(s);
    const pre = document.createElement('pre');
    pre.textContent = data.sql;
    d.appendChild(pre);
    b.appendChild(d);
  }

  // 节点轨迹折叠块
  if (data.trace && data.trace.length) {
    const d = document.createElement('details');
    const s = document.createElement('summary');
    s.textContent = `查看节点轨迹（${data.trace.length} 步）`;
    d.appendChild(s);
    data.trace.forEach(t => {
      const line = document.createElement('div');
      line.className = 'trace-line';
      line.textContent = t;
      d.appendChild(line);
    });
    b.appendChild(d);
  }

  // 耗时
  if (data.elapsed != null) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = `耗时 ${data.elapsed}s`;
    b.appendChild(m);
  }

  row.appendChild(b);
  chatEl.appendChild(row);
  scrollBottom();
}

function appendError(msg) {
  const row = document.createElement('div');
  row.className = 'row ai';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.style.borderColor = '#fecaca';
  b.style.background = '#fef2f2';
  b.style.color = '#991b1b';
  b.textContent = '出错了：' + msg;
  row.appendChild(b);
  chatEl.appendChild(row);
  scrollBottom();
}

function appendLoading() {
  const row = document.createElement('div');
  row.className = 'row ai';
  row.id = 'loading';
  const b = document.createElement('div');
  b.className = 'bubble dots';
  b.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(b);
  chatEl.appendChild(row);
  scrollBottom();
  return row;
}

function scrollBottom() {
  chatEl.parentElement.scrollTop = chatEl.parentElement.scrollHeight;
}

/* ---------- 发送 ---------- */
async function ask(question) {
  appendUser(question);
  const loading = appendLoading();
  sendEl.disabled = true;

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    const data = await r.json();
    loading.remove();
    if (!r.ok) {
      appendError(data.error || ('HTTP ' + r.status));
    } else {
      appendAI(data);
    }
  } catch (e) {
    loading.remove();
    appendError(e.message || '网络错误');
  } finally {
    sendEl.disabled = false;
    inputEl.focus();
  }
}

formEl.addEventListener('submit', e => {
  e.preventDefault();
  const q = inputEl.value.trim();
  if (!q) return;
  inputEl.value = '';
  autoResize();
  ask(q);
});

// Enter 发送，Shift+Enter 换行
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    formEl.requestSubmit();
  }
});

// 输入框随内容增高
function autoResize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
}
inputEl.addEventListener('input', autoResize);

init();
</script>
</body>
</html>
